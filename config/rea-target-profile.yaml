target: realestate.com.au
displayName: REA
domains:
  - www.realestate.com.au
  - realestate.com.au
dataSource:
  primary: window.ArgonautExchange
  appKey: resi-property_listing-experience-web
  cacheKey: urqlClientCache
  searchKeys:
    sale: buySearch
    rent: rentSearch
  detailKey: details
blockShape:
  vendor: Kasada
  markers:
    - window.KPSDK
    - ips.js
    - KP_UIDz
  typicalShellBytesMax: 5000
  observedShellBytes: 715
  initialStatusCodes:
    - 429
    - 403
headersOfInterest:
  - x-kpsdk-ct
  - x-kpsdk-cd
  - x-kpsdk-st
  - x-kpsdk-r
endpoints:
  challengeScriptHint: /ips.js
  tokenSubmitHint: /tl
  fingerprintHint: /fp
providers:
  preferred:
    - internal_mac_runner
    - internal_windows_runner
  forbiddenDefault:
    - apify_xvfb_chrome
    - camoufox_rea
contractTests:
  - id: TC-REA-SALE-SRP
    kind: sale_search
    url: "https://www.realestate.com.au/buy/in-melbourne,+vic/list-1"
    minBytes: 100000
    requireArgonaut: true
    minListings: 1
  - id: TC-REA-RENT-SRP
    kind: rent_search
    url: "https://www.realestate.com.au/rent/in-melbourne,+vic/list-1"
    minBytes: 100000
    requireArgonaut: true
    minListings: 1
  - id: TC-REA-SALE-LDP
    kind: sale_detail
    url: "https://www.realestate.com.au/property-house-vic-richmond-149000000"
    minBytes: 30000
    requireArgonaut: true
    requireDetailId: true
  - id: TC-REA-RENT-LDP
    kind: rent_detail
    url: "https://www.realestate.com.au/property-apartment-vic-melbourne-149000001"
    minBytes: 30000
    requireArgonaut: true
    requireDetailId: true
canaryActorInput:
  location: "Melbourne, VIC"
  includeSale: true
  includeRent: true
  maxItems: 2
  htmlProvider: internal_mac_runner
