[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-unblocker"
version = "0.1.0"
description = "Self-hosted HTML provider gateway and Kasada observability for realestate.com.au"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]
recon = [
  "playwright>=1.49.0",
  "curl_cffi>=0.7.0",
]

[project.scripts]
rea-gateway = "rea_unblocker.gateway.app:main"
rea-kasada-probe = "rea_unblocker.recorder.probe:main"
mem0ctl = "mem0_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
